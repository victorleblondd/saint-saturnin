{%- assign m = site.data.mairie -%}
<dl class="horaires">
  {%- for h in m.horaires %}{% unless include.semaine_complete != true and h.ferme %}
  <div data-jour="{{ forloop.index }}"{% if h.ferme %} class="ferme"{% endif %}><dt>{{ h.jour }}</dt><dd>{% if h.ferme %}Fermée{% else %}<span class="sans-retour">{{ h.matin }}</span>{% if h.apres_midi %} <span class="sans-retour">{{ h.apres_midi }}</span>{% endif %}{% endif %}</dd></div>
  {%- endunless %}{% endfor %}
</dl>
