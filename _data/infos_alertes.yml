# =====================================================================
#  INFOS & ALERTES DE LA MAIRIE
#  La publication la plus récente se place TOUT EN HAUT de la liste.
#
#  Ajouter un avis en PDF :
#    1. Déposer le fichier PDF dans le dossier  documents/infos-alertes/
#       Nom conseillé : AAAA-MM-JJ-sujet-court.pdf  (sans accents ni espaces)
#       (ou ajouter son adresse dans outils/fichiers-a-recuperer.txt : voir README.md)
#    2. Copier le modèle ci-dessous tout en haut de la liste, puis le remplir.
#
#  - date: "AAAA-MM-JJ"               date de l'avis
#    heure: "HH:MM"                   facultatif
#    type: alerte                     alerte (rouge) ou info (bleu)
#    theme: eau                       eau, travaux, vie (services et vie locale)
#    titre: "Titre de l'avis"
#    resume: "Une ou deux phrases qui disent l'essentiel."
#    pdf: "AAAA-MM-JJ-sujet-court.pdf"    nom exact du fichier déposé
#    bandeau_jusquau: "AAAA-MM-JJ"    facultatif : bandeau rouge sur l'accueil
#                                     jusqu'à cette date incluse (alertes)
#
#  Champ facultatif « texte » : le texte complet de l'avis (version lisible
#  sans ouvrir le PDF). Les avis sans PDF affichent ce texte.
# =====================================================================

- date: "2026-09-23"
  type: info
  theme: vie
  titre: "L'eau dans la réserve des tourbières du Jolan et de la Gazelle, jeudi 15 octobre"
  resume: "Le Parc des Volcans d'Auvergne présente deux études menées dans la réserve naturelle régionale, le jeudi 15 octobre de 9 h à 12 h 30, à Ségur-les-Villas. Gratuit, sur inscription avant le 13 octobre."
  pdf: "2026-09-23-tourbieres-du-jolan-et-de-la-gazelle.pdf"
  texte: |
    <p><strong>L'eau dans la réserve des tourbières du Jolan et de la Gazelle : entre qualité et préservation.</strong></p>
    <p><strong>Jeudi 15 octobre 2026, de 9 h à 12 h 30</strong>, à Ségur-les-Villas. Rendez-vous à la salle polyvalente de Ségur-les-Villas.</p>
    <ul>
      <li>présentation de deux études : les poissons et les écrevisses ; la qualité de l'eau de l'étang du Jolan et son influence sur les tourbières ;</li>
      <li>sortie dans la réserve naturelle et pique-nique tiré du sac.</li>
    </ul>
    <p>Gratuit. <strong>Inscription obligatoire avant le 13 octobre</strong> : <a href="tel:+33471202210">04 71 20 22 10</a> ou <a href="mailto:lquinquiry@parcdesvolcans.fr">lquinquiry@parcdesvolcans.fr</a>.</p>
    <p>Atelier proposé par le Parc des Volcans d'Auvergne, en partenariat avec la commune de Ségur-les-Villas, avec le soutien financier de l'Agence de l'eau Adour-Garonne et de la Région Auvergne-Rhône-Alpes.</p>

