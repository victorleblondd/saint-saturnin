- date: "2026-09-09"
  heure: "15:54"
  type: alerte
  theme: eau
  titre: "Eau potable : appel à la vigilance"
  resume: "L'alimentation en eau potable devient préoccupante : les débits des captages diminuent chaque jour et les châteaux d'eau se remplissent difficilement. Limitez dès à présent votre consommation d'eau au strict nécessaire."
  texte: |
    <p>L'alimentation en eau potable devient préoccupante. Les débits des captages diminuent chaque jour, et les châteaux d'eau se remplissent difficilement.</p>
    <p>Nous appelons chacun à la vigilance et à limiter dès à présent sa consommation d'eau au <strong>strict nécessaire</strong> : consommation humaine, consommation animale, fabrication des fromages.</p>
    <p>Merci à toutes et à tous pour votre vigilance et votre mobilisation. Nous vous informerons quand la situation sera redevenue normale.</p>

